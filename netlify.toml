/*
  Netlify / compatible static host headers
  Security + performance defaults for TFT Legal Service
*/
/*
  X-Frame-Options: DENY
  X-Content-Type-Options: nosniff
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: camera=(), microphone=(), geolocation=()
*/

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/about-us"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/compliance-policy"
  to = "/compliance.html"
  status = 301

[[redirects]]
  from = "/torts"
  to = "/torts.html"
  status = 301

[[redirects]]
  from = "/mva"
  to = "/mva.html"
  status = 301

[[redirects]]
  from = "/ssdi"
  to = "/ssdi.html"
  status = 301

[[redirects]]
  from = "/mortgage"
  to = "/mortgage.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
